<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00c853;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Arrow/chart icon rising up -->
  <g transform="translate(10, 10)">
    <!-- Bar chart bars -->
    <rect x="0" y="52" width="12" height="28" rx="3" fill="url(#iconGrad)" opacity="0.5"/>
    <rect x="18" y="36" width="12" height="44" rx="3" fill="url(#iconGrad)" opacity="0.7"/>
    <rect x="36" y="16" width="12" height="64" rx="3" fill="url(#iconGrad)" opacity="0.9"/>
    <!-- Rising arrow -->
    <path d="M6 48 L24 32 L42 12" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="38,6 50,10 44,20" fill="#00c853"/>
  </g>
  <!-- VizionUp text -->
  <text x="72" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="url(#grad)" letter-spacing="-1">
    Vizion<tspan fill="#00c853">Up</tspan>
  </text>
  <!-- Wealth subtitle -->
  <text x="74" y="76" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#6c757d" letter-spacing="4">
    WEALTH
  </text>
</svg>
